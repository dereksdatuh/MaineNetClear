<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="NetHauls logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16212E"/>
      <stop offset="100%" stop-color="#080C10"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9AD4F7"/>
      <stop offset="100%" stop-color="#2E8FD4"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="36" fill="url(#bg)"/>

  <!-- abstract roofline crest, two parallel chevrons -->
  <g fill="none" stroke="url(#crest)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 132 L120 64 L192 132"/>
    <path d="M64 152 L120 100 L176 152"/>
  </g>
</svg>
